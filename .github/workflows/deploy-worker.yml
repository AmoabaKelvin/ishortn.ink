name: Deploy Worker

on:
  push:
    branches: [main]
  # Kelvin runs this by hand to ship a migration the automatic deploy refused.
  workflow_dispatch:
    inputs:
      allow_dangerous_migrations:
        description: "Apply migrations that drop, rename, rewrite or delete data"
        type: boolean
        default: false

jobs:
  # Pending drizzle migrations go in before the code that needs them. The
  # migrator Worker applies them through Hyperdrive, so CI never sees the
  # database password, and it refuses dangerous ones unless allowed above.
  migrate:
    runs-on: ubuntu-latest
    # Never cancelled halfway through a migration; a newer push waits its turn.
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Bundle migrations into the migrator
        run: bun scripts/migrations/bundle.ts

      - name: Deploy the migrator
        run: |
          npx wrangler deploy -c workers/migrator/wrangler.jsonc
          printf '%s' "$MIGRATE_KEY" | npx wrangler secret put MIGRATE_KEY -c workers/migrator/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c30154a387214494e77fad7672e39e
          MIGRATE_KEY: ${{ secrets.MIGRATE_KEY }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: mysql://placeholder:placeholder@localhost:3306/placeholder

      - name: Apply pending migrations
        run: bun scripts/migrations/apply.ts apply
        env:
          MIGRATE_KEY: ${{ secrets.MIGRATE_KEY }}
          MIGRATOR_URL: https://ishortn-migrator.kel-amoaba.workers.dev
          ALLOW_DANGEROUS_MIGRATIONS: ${{ inputs.allow_dangerous_migrations == true }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Write build env
        run: printf '%s\n' "$BUILD_ENV" > .env.production.local
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}

      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c30154a387214494e77fad7672e39e
          # Never dialed during deploy; wrangler only insists the value exists.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: mysql://placeholder:placeholder@localhost:3306/placeholder
