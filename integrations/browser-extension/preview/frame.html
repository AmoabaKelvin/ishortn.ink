<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iShortn preview</title>
    <link rel="stylesheet" href="frame.css" />
  </head>
  <body>
    <div class="window">
      <div class="tabs">
        <div class="dots"><i></i><i></i><i></i></div>

          <span class="favicon"></span>
          <span>How we cut our page load time in half</span>
        </div>

      </div>
      <div class="toolbar">
        <span class="nav"></span><span class="nav"></span><span class="nav"></span>
        <div class="omnibox">www.example.com/blog/how-we-cut-our-page-load-time-in-half</div>
        <span class="ext"><img src="icons/icon-32.png" alt="" width="16" height="16" /></span>
        <span class="nav"></span>
      </div>
      <div class="page">
        <div class="article">
          <div class="bar eyebrow"></div>
          <div class="bar h1"></div>
          <div class="bar h1 short"></div>
          <div class="bar meta"></div>
          <div class="hero"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar mid"></div>
          <div class="bar"></div>
          <div class="bar short"></div>
        </div>
      </div>

    <script src="frame.js"></script>

</html>
